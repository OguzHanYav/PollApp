<div class="create-container">
  <div class="create-card">
    <div class="create-header">
      <span class="badge">Draft</span>
      <h1>📝 Create New Survey</h1>
      <button type="button" class="btn-cancel" (click)="cancel()">Cancel ✕</button>
    </div>

    <form [formGroup]="surveyForm" (ngSubmit)="onSubmit()">
      <div class="form-row">
        <!-- Survey Name (Pflicht) -->
        <div class="form-group">
          <label>Survey Name *</label>
          <div class="field-with-icon">
            <input type="text" formControlName="title" placeholder="e.g., Customer Feedback 2026" />
            <button type="button" class="icon-btn" (click)="clearField('title')" aria-label="Clear">🗑️</button>
          </div>
          <small *ngIf="surveyForm.get('title')?.touched && surveyForm.get('title')?.invalid">
            Please enter a survey name.
          </small>
        </div>

        <!-- Description (optional) -->
        <div class="form-group">
          <label>Describing Text <span class="optional">(optional)</span></label>
          <div class="field-with-icon">
            <textarea formControlName="description" rows="3" placeholder="Describe the purpose of this survey..."></textarea>
            <button type="button" class="icon-btn" (click)="clearField('description')" aria-label="Clear">🗑️</button>
          </div>
        </div>
      </div>

      <div class="form-row">
        <!-- End Date (optional) -->
        <div class="form-group">
          <label>Set End Date <span class="optional">(optional)</span></label>
          <div class="field-with-icon">
            <input type="date" formControlName="end_date" />
            <button type="button" class="icon-btn" (click)="clearField('end_date')" aria-label="Clear">🗑️</button>
          </div>
        </div>

        <!-- Category (Pflicht) -->
        <div class="form-group">
          <label>Choose Category *</label>
          <select formControlName="category">
            <option value="">Select a category...</option>
            <option value="Feedback">Feedback</option>
            <option value="Market Research">Market Research</option>
            <option value="Employee Satisfaction">Employee Satisfaction</option>
            <option value="Customer Service">Customer Service</option>
            <option value="Product">Product</option>
            <option value="Other">Other</option>
          </select>
          <small *ngIf="surveyForm.get('category')?.touched && surveyForm.get('category')?.invalid">
            Please select a category.
          </small>
        </div>
      </div>

      <!-- Questions -->
      <div class="questions-section">
        <h3>Questions</h3>

        <!--
          formArrayName="questions" muss auf einem Eltern-Element sitzen, das
          die *ngFor-Schleife der question-blocks umschließt - ohne dieses
          Wrapper-Element findet Angular die FormGroup mit Index "0", "1" usw.
          nicht ("Cannot find control with name: '0'").
        -->
        <div formArrayName="questions">
          <div class="question-block" *ngFor="let q of questions.controls; let qIndex = index" [formGroupName]="qIndex">
            <div class="question-header">
              <span class="question-number">Question {{ qIndex + 1 }}</span>
              <button type="button" class="btn-delete-question" (click)="removeQuestion(qIndex)">
                <span *ngIf="qIndex === 0">🗑️ Clear fields</span>
                <span *ngIf="qIndex > 0">🗑️ Remove question</span>
              </button>
            </div>

            <div class="form-group">
              <label>Question Text *</label>
              <input type="text" formControlName="question_text" placeholder="Enter your question..." />
              <small *ngIf="q.get('question_text')?.touched && q.get('question_text')?.invalid">
                Please enter a question.
              </small>
            </div>

            <div class="form-group checkbox">
              <input type="checkbox" formControlName="allow_multiple" id="allow_multiple_{{ qIndex }}" />
              <label for="allow_multiple_{{ qIndex }}">Allow multiple answers</label>
            </div>

            <!-- Answers (Pflicht) -->
            <div class="answers-section">
              <label>Answers *</label>
              <div formArrayName="answers">
                <div class="answer-row" *ngFor="let a of getAnswers(qIndex).controls; let aIndex = index" [formGroupName]="aIndex">
                  <input type="text" formControlName="answer_text" placeholder="Answer {{ getAnswerLetter(aIndex) }}" />
                  <button type="button" class="btn-remove-answer" (click)="removeAnswer(qIndex, aIndex)" *ngIf="getAnswers(qIndex).length > 2">
                    ✕
                  </button>
                </div>
                <button type="button" class="btn-add-answer" (click)="addAnswer(qIndex)">+ Add answer</button>
              </div>
            </div>
          </div>
        </div>

        <button type="button" class="btn-add-question" (click)="addQuestion()">+ Add next question</button>
      </div>

      <!-- Submit -->
      <button type="submit" class="btn-publish" [disabled]="surveyForm.invalid">Publish</button>
    </form>
  </div>

  <!-- OVERLAY -->
  <div class="overlay" *ngIf="showPublishOverlay()">
    <div class="overlay-content">
      <div class="success-icon">🎉</div>
      <h2>Your survey is now published!</h2>
      <p>You can view the results in the detail view.</p>
      <button class="btn-primary" (click)="closeOverlay()">Go to Survey</button>
    </div>
  </div>
</div>
