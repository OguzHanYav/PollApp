<div class="create-page">
  <div class="create-card">
    <div class="create-header">
      <div>
        <span class="badge">Draft</span>
        <h1>Create New Survey</h1>
      </div>
      <button type="button" class="btn-cancel" (click)="cancel()">Cancel ✕</button>
    </div>

    <form [formGroup]="surveyForm" (ngSubmit)="onSubmit()">
      <div class="form-grid">

        <!-- Survey Name (Pflicht) -->
        <div class="form-group grid-title">
          <label>Survey Name</label>
          <div class="field-with-icon">
            <input type="text" formControlName="title" placeholder="e.g., Customer Feedback 2026" />
            <button type="button" class="icon-btn" (click)="clearField('title')" aria-label="Clear">
              <img src="./assets/Delete.svg" alt="">
            </button>
          </div>
          <small *ngIf="surveyForm.get('title')?.touched && surveyForm.get('title')?.invalid">
            Please enter a survey name.
          </small>
        </div>

        <!-- Description (optional) -->
        <div class="form-group grid-desc">
          <label>Describing Text <span class="optional">(optional)</span></label>
          <div class="field-with-icon-description">
            <textarea class="descriptionInput" formControlName="description" rows="3"
              placeholder="Describe the purpose of this survey..."></textarea>
            <button type="button" class="icon-btn" (click)="clearField('description')" aria-label="Clear">
              <img src="./assets/Delete.svg" alt="">
            </button>
          </div>
        </div>

        <!-- End Date + Category -->
        <div class="meta-row grid-meta">
          <div class="form-group">
            <label>Set End Date <span class="optional">(optional)</span></label>
            <div class="field-with-icon">
              <input type="date" formControlName="end_date" class="date-input-custom"
                [class.has-value]="surveyForm.get('end_date')?.value" /> <button type="button" class="icon-btn"
                (click)="clearField('end_date')" aria-label="Clear">
                <img src="./assets/Delete.svg" alt="">
              </button>
            </div>
          </div>

          <div class="form-group">
            <div class="category-select" [class.open]="categoryDropdownOpen()">
              <button type="button" class="category-select__toggle" (click)="toggleCategoryDropdown($event)">
                <span class="category-select__label">{{ surveyForm.get('category')?.value || 'Choose category' }}</span>
                <svg class="category-select__arrow" width="16" height="10" viewBox="0 0 16 10"
                  xmlns="http://www.w3.org/2000/svg">
                  <path d="M0 1L8 9L16 1H0Z" />
                </svg>
              </button>

              <ul class="category-select__menu" *ngIf="categoryDropdownOpen()">
                <li *ngFor="let cat of categoryOptions" [class.active]="surveyForm.get('category')?.value === cat"
                  (click)="selectCategory(cat)">
                  {{ cat }}
                </li>
              </ul>
            </div>
            <small *ngIf="surveyForm.get('category')?.touched && surveyForm.get('category')?.invalid">
              Please select a category.
            </small>
          </div>
        </div>

        <!-- Questions -->
        <div class="questions-section grid-questions" formArrayName="questions">
          <div class="question-block" *ngFor="let q of questions.controls; let qIndex = index" [formGroupName]="qIndex">
            <div class="question-header">
              <span class="question-number">{{ qIndex + 1 }}. Question</span>
              <button type="button" class="btn-delete-question" (click)="removeQuestion(qIndex)"
                aria-label="Delete question">
                <img src="./assets/Delete.svg" alt="">
              </button>
            </div>

            <div class="form-group">
              <input type="text" formControlName="question_text" placeholder="Enter your question..." />
              <small *ngIf="q.get('question_text')?.touched && q.get('question_text')?.invalid">
                Please enter a question.
              </small>
            </div>

            <!-- Answers -->
            <div class="answers-section">
              <div class="answers-header">
                <label>Answers *</label>
                <div class="form-group checkbox">
                  <input type="checkbox" formControlName="allow_multiple" id="allow_multiple_{{ qIndex }}" />
                  <label for="allow_multiple_{{ qIndex }}">Allow multiple answers</label>
                </div>
              </div>
              <div formArrayName="answers">
                <div class="answer-row" *ngFor="let a of getAnswers(qIndex).controls; let aIndex = index"
                  [formGroupName]="aIndex">
                  <span class="answer-letter">{{ getAnswerLetter(aIndex) }}.</span>
                  <input type="text" formControlName="answer_text" placeholder="Answer {{ getAnswerLetter(aIndex) }}" />
                  <button type="button" class="btn-remove-answer" (click)="removeAnswer(qIndex, aIndex)"
                    [disabled]="getAnswers(qIndex).length <= 2" aria-label="Remove answer">
                    <img src="./assets/Delete.svg" alt="">
                  </button>
                </div>
                <button type="button" class="btn-add-answer" (click)="addAnswer(qIndex)">
                  <span>Add answer</span>
                  <img src="./assets/add_circle.svg" alt="">
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Add Question Button -->
        <div class="grid-addq">
          <button type="button" class="btn-add-question" (click)="addQuestion()">
            <span>Add next question</span>
            <img src="./assets/add_circle.svg" alt="">
          </button>
        </div>

      </div> <!-- Ende form-grid -->

      <!-- Publish Button -->
      <button type="submit" class="btn-publish" [disabled]="surveyForm.invalid">Publish</button>
    </form>
  </div> <!-- Ende create-card -->

  <!-- OVERLAY -->
  <div class="publish-toast" *ngIf="showPublishOverlay()">
    <span>Your survey is now{{ '\n' }}published</span>
    <button type="button" class="publish-toast__close" (click)="closeOverlay()" aria-label="Close">✕</button>
  </div>
</div> <!-- Ende create-page -->
